name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes da auditoria (site certo passa, site com erros é pego)
        run: python tests/test_auditar.py
